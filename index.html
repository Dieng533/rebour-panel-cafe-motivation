<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>GO'UP – Minuteur Café Motivation</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Bootstrap + Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<style>
:root {
    --orange-goup: #e06a16;
    --orange-goup-light: #f18c42;
    --orange-goup-dark: #c55a12;
    --bleu-nuit-goup: #1a1a26;
    --bleu-nuit-light: #2a2a3a;
    --bleu-nuit-dark: #121218;
    --blanc-creme: #f8f9fa;
}

body {
    background: radial-gradient(circle at top, var(--bleu-nuit-light), var(--bleu-nuit-dark));
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: var(--blanc-creme);
}

.panel-card {
    background: linear-gradient(145deg, var(--bleu-nuit-goup), var(--bleu-nuit-dark));
    border-radius: 30px;
    padding: 30px;
    max-width: 650px;
    width: 100%;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6);
}

.logo {
    max-height: 70px;
    margin-bottom: 15px;
}

.time-box {
    background: var(--blanc-creme);
    color: var(--bleu-nuit-goup);
    border-radius: 20px;
    padding: 25px;
    font-size: 4rem;
    font-weight: 900;
    text-align: center;
}

.label {
    text-transform: uppercase;
    font-size: 0.85rem;
    letter-spacing: 2px;
    color: var(--orange-goup-light);
    margin-top: 8px;
}

.warning {
    background: var(--orange-goup) !important;
    color: white !important;
    animation: pulse 1s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.08); }
    100% { transform: scale(1); }
}

.btn-icon {
    font-size: 1.6rem;
    border-radius: 50%;
    width: 65px;
    height: 65px;
}

.btn-goup {
    background: linear-gradient(135deg, var(--orange-goup), var(--orange-goup-dark));
    color: white;
    border: none;
}

.btn-goup:hover { opacity: 0.9; }
</style>
</head>

<body>

<div class="panel-card text-center">

    <!-- LOGO -->
    <img src="logo.png" class="logo img-fluid" alt="GO'UP">

    <h3 class="mb-4">🎤 Café Motivation – Minuteur Officiel</h3>

    <!-- TEMPS -->
    <div class="row g-3 mb-4">
        <div class="col-6">
            <div id="minutes" class="time-box">07</div>
            <div class="label">Minutes</div>
        </div>
        <div class="col-6">
            <div id="seconds" class="time-box">00</div>
            <div class="label">Secondes</div>
        </div>
    </div>

    <!-- PRÉRÉGLAGES -->
    <div class="d-flex justify-content-center gap-2 mb-4">
        <button class="btn btn-outline-light" onclick="setTime(7)">🕖 7 min</button>
        <button class="btn btn-outline-light" onclick="setTime(1)">⏱️ 1 min</button>
        <button class="btn btn-outline-light" onclick="setTime(2)">👩‍🎤 2 min</button>
    </div>

    <!-- CONTROLES -->
    <div class="d-flex justify-content-center gap-4">
        <button id="startBtn" class="btn btn-goup btn-icon">
            <i class="bi bi-play-fill"></i>
        </button>

        <button id="resetBtn" class="btn btn-outline-light btn-icon">
            <i class="bi bi-arrow-counterclockwise"></i>
        </button>
    </div>

</div>

<!-- SONS -->
<audio id="warningSound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>
<audio id="endSound" src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg"></audio>

<script>
let totalSeconds = 420;
let remaining = totalSeconds;
let timer = null;

function updateUI() {
    let m = Math.floor(remaining / 60);
    let s = remaining % 60;
    $("#minutes").text(String(m).padStart(2,'0'));
    $("#seconds").text(String(s).padStart(2,'0'));

    if (remaining <= 30) $(".time-box").addClass("warning");
    else $(".time-box").removeClass("warning");
}

function setTime(minutes) {
    clearInterval(timer);
    timer = null;
    totalSeconds = minutes * 60;
    remaining = totalSeconds;
    updateUI();
}

function toggleTimer() {
    if (timer) {
        clearInterval(timer);
        timer = null;
        return;
    }

    timer = setInterval(() => {
        remaining--;
        updateUI();

        if (remaining <= 30 && remaining > 0)
            document.getElementById("warningSound").play();

        if (remaining === 0)
            document.getElementById("endSound").play();

        if (remaining <= 0) {
            clearInterval(timer);
            timer = null;
        }
    }, 1000);
}

$("#startBtn").click(toggleTimer);
$("#resetBtn").click(() => setTime(totalSeconds / 60));

$(document).keydown(e => {
    if (e.code === "Space") {
        e.preventDefault();
        toggleTimer();
    }
    if (e.key.toLowerCase() === "r") {
        setTime(totalSeconds / 60);
    }
});

updateUI();
</script>

</body>
</html>
